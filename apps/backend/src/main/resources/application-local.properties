spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/animeclub}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}
spring.datasource.username=${DB_USERNAME:animeclub}
spring.datasource.password=${DB_PASSWORD:animeclub}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=optional:classpath:/schema-postgres.sql
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:4200,http://127.0.0.1:4200,http://*:4200}
app.frontend-url=${APP_FRONTEND_URL:http://127.0.0.1:4200}
app.email-confirmation.expose-link=${EMAIL_CONFIRMATION_EXPOSE_LINK:true}
app.mail.brand-image-url=${MAIL_BRAND_IMAGE_URL:}
app.mail.password-reset-image-url=${MAIL_PASSWORD_RESET_IMAGE_URL:}
app.discord.oauth.client-id=${DISCORD_OAUTH_CLIENT_ID:${DISCORD_CLIENT_ID:}}
app.discord.oauth.client-secret=${DISCORD_OAUTH_CLIENT_SECRET:${DISCORD_CLIENT_SECRET:}}
app.discord.oauth.token-url=${DISCORD_OAUTH_TOKEN_URL:https://discord.com/api/v10/oauth2/token}
app.discord.oauth.user-url=${DISCORD_OAUTH_USER_URL:https://discord.com/api/v10/users/@me}
app.admin.import-token=${ADMIN_IMPORT_TOKEN:}
app.admin.require-token-on-startup=${ADMIN_REQUIRE_TOKEN_ON_STARTUP:false}
app.security.hsts-enabled=${SECURITY_HSTS_ENABLED:false}
app.security.origin-check-enabled=${ORIGIN_CHECK_ENABLED:true}
app.session.cookie-name=${SESSION_COOKIE_NAME:animeclub_session}
app.session.cookie-path=${SESSION_COOKIE_PATH:/}
app.session.cookie-secure=${SESSION_COOKIE_SECURE:false}
app.session.cookie-same-site=${SESSION_COOKIE_SAME_SITE:Lax}
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
app.rate-limit.public-max-requests=${RATE_LIMIT_PUBLIC_MAX_REQUESTS:120}
app.rate-limit.sensitive-max-requests=${RATE_LIMIT_SENSITIVE_MAX_REQUESTS:20}
app.jikan.anime-url=${JIKAN_ANIME_URL:https://api.jikan.moe/v4/anime}
app.jikan.characters-url=${JIKAN_CHARACTERS_URL:https://api.jikan.moe/v4/characters}
app.jikan.import-delay-ms=${JIKAN_IMPORT_DELAY_MS:1300}
app.jikan.character-import-delay-ms=${JIKAN_CHARACTER_IMPORT_DELAY_MS:850}
app.anilist.graphql-url=${ANILIST_GRAPHQL_URL:https://graphql.anilist.co}
app.kitsu.anime-url=${KITSU_ANIME_URL:https://kitsu.io/api/edge/anime}
app.catalog.enrich-on-read=${CATALOG_ENRICH_ON_READ:false}
app.catalog.image-color-lookup-enabled=${CATALOG_IMAGE_COLOR_LOOKUP_ENABLED:true}
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:14MB}

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.from=${SMTP_FROM:no-reply@animeclub.fr}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,info,metrics,prometheus}
management.endpoint.health.show-details=always
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}
management.metrics.tags.application=animeclub
